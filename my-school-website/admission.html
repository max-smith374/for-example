<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Green Valley Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eaf4fb 0%, #dff3ec 50%, #fef8e7 100%);
    min-height: 100vh;
  }

  .top-bar {
    background: #1b6ca8;
  }

  .top-bar a { color: white; text-decoration: none; }

  .page-hero {
    padding: 60px 0 20px;
    text-align: center;
    color: #1b6ca8;
  }
</style>
</head>
<body>

<div class="top-bar py-3">
  <div class="container">
    <a href="index.html">&larr; Back to Green Valley Academy</a>
  </div>
</div>

<div class="page-hero">
  <h1 class="fw-bold">Admissions Are Open</h1>
  <p class="lead text-muted">Apply now and give your child a strong academic foundation.</p>
</div>

<div class="container py-4">
  <div class="row align-items-start g-5 justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm p-4 border-0">
        <h5 style="color:#1b6ca8;">Why Choose Us?</h5>
        <ul class="text-muted mb-0">
          <li>Qualified teachers</li>
          <li>Computer lessons</li>
          <li>Safe learning environment</li>
          <li>Sports and clubs</li>
        </ul>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm p-4 border-0">
        <h3 class="fw-bold mb-4" style="color:#1b6ca8;">Admission Form</h3>
        <form id="admissionForm">
          <div class="mb-3">
            <label for="studentName" class="form-label">Student Name</label>
            <input type="text" class="form-control" id="studentName" placeholder="Enter student name" required>
          </div>
          <div class="mb-3">
            <label for="parentName" class="form-label">Parent Name</label>
            <input type="text" class="form-control" id="parentName" placeholder="Enter parent name" required>
          </div>
          <div class="mb-3">
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phoneNumber" placeholder="Enter phone number" required>
          </div>
          <div class="mb-3">
            <label for="classSelect" class="form-label">Class Applying For</label>
            <select class="form-select" id="classSelect" required>
              <option selected disabled value="">Select class</option>
              <option>Nursery</option>
              <option>Primary 1</option>
              <option>Primary 2</option>
              <option>Primary 3</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Write message"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">
            <span class="spinner-border spinner-border-sm d-none" id="submitSpinner" role="status" aria-hidden="true"></span>
            <span id="submitLabel">Submit Application</span>
          </button>

          <div class="alert alert-success mt-3 d-none" id="successMsg">
            Application submitted! We'll be in touch soon.
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('admissionForm');
  const submitBtn = document.getElementById('submitBtn');
  const spinner = document.getElementById('submitSpinner');
  const label = document.getElementById('submitLabel');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    spinner.classList.remove('d-none');
    label.textContent = 'Submitting...';
    submitBtn.disabled = true;

    setTimeout(function () {
      spinner.classList.add('d-none');
      label.textContent = 'Submit Application';
      submitBtn.disabled = false;
      successMsg.classList.remove('d-none');
      form.reset();
    }, 1500);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
